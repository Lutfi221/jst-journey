<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obstacle Shooter</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 360px; text-align: center; pointer-events: none; }
  #bar { height: 18px; border: 2px solid #fff; background: #300; }
  #hp { height: 100%; width: 100%; background: linear-gradient(#5f5, #2a2); transition: width .15s; }
  #info { margin-top: 6px; font-size: 14px; text-shadow: 0 0 4px #000; }
  #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: #000a; font-size: 32px; }
</style>
</head>
<body>
<div id="hud">
  <div id="bar"><div id="hp"></div></div>
  <div id="info">Ammo: <span id="ammo"></span> &nbsp; Score: <span id="score">0</span></div>
</div>
<div id="over"><div>GAME OVER</div><div style="font-size:16px">Score <span id="fs"></span> — press R to restart</div></div>
<div style="position:fixed;bottom:8px;left:8px;font-size:12px;opacity:.7">Arrows: move · Space: shoot</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111118);
scene.fog = new THREE.Fog(0x111118, 40, 130);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(5, 10, 20);
scene.add(sun);

// Player
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1.4, 1.4, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x00ff66, metalness: .3, roughness: .4 })
);
scene.add(player);
const PR = 0.7, BOUND = 12;

// Light rays: thin aim beam (shot path) + translucent lane (collision path)
const glow = { transparent: true, blending: THREE.AdditiveBlending, depthWrite: false };
const beam = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1), new THREE.MeshBasicMaterial({ color: 0x66ffaa, opacity: 0.9, ...glow }));
const lane = new THREE.Mesh(new THREE.BoxGeometry(PR * 2, PR * 2, 1), new THREE.MeshBasicMaterial({ color: 0x33ff88, opacity: 0.08, ...glow }));
const spot = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.9, ...glow }));
scene.add(beam, lane, spot);
function updateRays() {
  // nearest obstacle in the path of the aim beam (in front of player)
  let hitZ = -150;
  for (const o of obstacles) {
    const p = o.mesh.position;
    const front = p.z + o.d / 2;
    if (front < player.position.z && Math.abs(p.x - player.position.x) < o.w / 2 + .1 && Math.abs(p.y - player.position.y) < o.h / 2 + .1) hitZ = Math.max(hitZ, front);
  }
  const hit = hitZ > -150;
  const len = player.position.z - hitZ;
  for (const m of [beam, lane]) {
    m.scale.z = len;
    m.position.set(player.position.x, player.position.y, player.position.z - len / 2);
  }
  const c = hit ? 0xff4422 : 0x66ffaa;
  beam.material.color.setHex(c);
  lane.material.color.setHex(hit ? 0xff3311 : 0x33ff88);
  spot.visible = hit;
  spot.material.color.setHex(0xff8855);
  spot.position.set(player.position.x, player.position.y, hitZ);
}

// Game state
let health, ammo, score, over, spawnT, ammoT;
let obstacles = [], bullets = [], shards = [];
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { shoot(); e.preventDefault(); }
  if (e.code === 'KeyR' && over) reset();
});
addEventListener('keyup', e => keys[e.code] = false);

const $ = id => document.getElementById(id);
function hud() {
  $('hp').style.width = Math.max(0, health) + '%';
  $('ammo').textContent = '●'.repeat(ammo) + '○'.repeat(10 - ammo);
  $('score').textContent = score;
}

function reset() {
  [...obstacles, ...bullets, ...shards].forEach(o => scene.remove(o.mesh));
  obstacles = []; bullets = []; shards = [];
  health = 100; ammo = 10; score = 0; over = false; spawnT = 0; ammoT = 0;
  player.position.set(0, 0, 0);
  $('over').style.display = 'none';
  hud();
}

function spawn() {
  const w = 3 + Math.random() * 5, h = 3 + Math.random() * 5, d = 4;
  const color = new THREE.Color().setHSL(Math.random() * 0.1, 0.7, 0.4);
  const mat = new THREE.MeshStandardMaterial({ color, roughness: .6, metalness: .2, emissive: 0xff2200, emissiveIntensity: 0 });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set((Math.random() - .5) * 2 * BOUND, (Math.random() - .5) * 2 * BOUND * .7, -150);
  scene.add(mesh);
  obstacles.push({ mesh, w, h, d, mat });
}

function shoot() {
  if (over || ammo <= 0) return;
  ammo--;
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffee55 })
  );
  mesh.position.copy(player.position);
  scene.add(mesh);
  bullets.push({ mesh });
  hud();
}

function obliterate(o) {
  // 1. Replace the big obstacle with many small cubes ("shards")
  const shardGeo = new THREE.BoxGeometry(1, 1, 1);
  for (let i = 0; i < 20; i++) {
    const mesh = new THREE.Mesh(shardGeo, o.mat);   // same look as the obstacle
    mesh.position.copy(o.mesh.position);            // start where the obstacle was
    scene.add(mesh);
    // 2. Give each shard a random speed in x, y, z
    shards.push({
      mesh,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      vz: (Math.random() - 0.5) * 20,
      life: 1,                                      // 1 -> 0 over one second
    });
  }
  // 3. Remove the original obstacle
  scene.remove(o.mesh);
}

// Would this obstacle hit the player if the player stays put?
function overlapsXY(o) {
  const p = o.mesh.position;
  return Math.abs(p.x - player.position.x) < o.w / 2 + PR && Math.abs(p.y - player.position.y) < o.h / 2 + PR;
}

const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!over) {
    const s = 12 * dt;
    if (keys.ArrowUp) player.position.y += s;
    if (keys.ArrowDown) player.position.y -= s;
    if (keys.ArrowLeft) player.position.x -= s;
    if (keys.ArrowRight) player.position.x += s;
    player.position.x = THREE.MathUtils.clamp(player.position.x, -BOUND, BOUND);
    player.position.y = THREE.MathUtils.clamp(player.position.y, -BOUND * .7, BOUND * .7);
    player.rotation.z = -(keys.ArrowRight ? 1 : 0) * .3 + (keys.ArrowLeft ? 1 : 0) * .3;

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.0 - score * 0.01); }
    ammoT += dt;
    if (ammoT > 1 && ammo < 10) { ammo++; ammoT = 0; hud(); }

    const speed = 35 + score * 0.5;

    for (const o of obstacles) {
      o.mesh.position.z += speed * dt;
      // light up when it is on a collision course and still ahead of the player
      const threat = o.mesh.position.z < player.position.z + o.d / 2 && overlapsXY(o);
      o.mat.emissiveIntensity = threat ? 0.6 + 0.4 * Math.sin(performance.now() / 60) : 0;
      o.dead = false;
      // collision
      if (Math.abs(o.mesh.position.z - player.position.z) < o.d / 2 + PR && overlapsXY(o)) {
        health -= 25; o.dead = true; obliterate(o);
        camera.position.x = (Math.random() - .5) * 1.5;
        hud();
        if (health <= 0) { over = true; $('fs').textContent = score; $('over').style.display = 'flex'; }
      } else if (o.mesh.position.z > 20) {
        o.dead = true; scene.remove(o.mesh); score++; hud();
      }
    }

    for (const b of bullets) {
      b.mesh.position.z -= 120 * dt;
      for (const o of obstacles) {
        if (o.dead) continue;
        const p = o.mesh.position, q = b.mesh.position;
        if (Math.abs(p.x - q.x) < o.w / 2 + .3 && Math.abs(p.y - q.y) < o.h / 2 + .3 && Math.abs(p.z - q.z) < o.d / 2 + .6) {
          o.dead = true; b.dead = true; obliterate(o); score += 2; hud();
          break;
        }
      }
      if (b.mesh.position.z < -160) b.dead = true;
    }
    obstacles = obstacles.filter(o => !o.dead);
    bullets = bullets.filter(b => { if (b.dead) scene.remove(b.mesh); return !b.dead; });
  }

  beam.visible = lane.visible = !over;
  if (over) spot.visible = false; else updateRays();

  // shard animation
  for (const s of shards) {
    s.life -= dt;                       // count down
    s.mesh.position.x += s.vx * dt;     // fly outward
    s.mesh.position.y += s.vy * dt;
    s.mesh.position.z += s.vz * dt;
    s.mesh.rotation.x += 5 * dt;        // spin
    s.mesh.scale.setScalar(Math.max(s.life, 0.01) * 1.5); // shrink to nothing
  }
  // Remove shards whose life ran out
  shards = shards.filter(s => {
    if (s.life <= 0) scene.remove(s.mesh);
    return s.life > 0;
  });

  camera.position.x *= 0.85; // shake decay
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

reset();
loop();
</script>
</body>
</html>
