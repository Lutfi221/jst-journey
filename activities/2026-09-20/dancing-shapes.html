<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Dancing Shapes - Quick Easing</title>
    <style>body { margin: 0; overflow: hidden; background-color: #111; } canvas { display: block; }</style>
</head>
<body>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA 
        // =========================================================

        let shapes = [];

        function setup(scene) {
            const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(grid);

            const geo1 = new THREE.BoxGeometry(1, 1, 1);
            const geo2 = new THREE.SphereGeometry(0.7, 16, 16);
            const geo3 = new THREE.ConeGeometry(0.8, 1.5, 16);

            const material = new THREE.MeshNormalMaterial({ flatShading: true });

            const cube = new THREE.Mesh(geo1, material);
            const sphere = new THREE.Mesh(geo2, material);
            const cone = new THREE.Mesh(geo3, material);

            cube.position.x = -3;
            sphere.position.x = 0;
            cone.position.x = 3;

            scene.add(cube);
            scene.add(sphere);
            scene.add(cone);

            shapes = [cube, sphere, cone];
        }

        function animate() {
            // Slower master clock for a more relaxed, observable rhythm
            const time = Date.now() * 0.002; 

            for (let i = 0; i < shapes.length; i++) {
                let shape = shapes[i];
                
                // Add a small delay based on their array position so they don't move simultaneously
                let clock = time + (i * 0.5);

                // --- 1. SET THE TARGETS ---
                
                // EVERY 2 BEATS: Rotate 90 degrees (Math.PI / 2)
                let rotationStep = Math.floor(clock / 2);
                let targetRotation = rotationStep * (Math.PI / 2);

                // EVERY 4 BEATS: Jump and Scale
                let jumpStep = Math.floor(clock / 4);
                let isJumping = (jumpStep % 2 === 1); // Alternates true/false every 4 beats
                
                let targetY = isJumping ? 2 : 0; 
                let targetScale = isJumping ? 1.5 : 1.0;

                // --- 2. THE "QUICK EASING" TRICK ---
                // Formula: Current = Current + (Target - Current) * Speed
                // Moving 10% (0.1) of the way there every frame creates a buttery smooth stop.
                
                shape.rotation.y += (targetRotation - shape.rotation.y) * 0.1;
                
                shape.position.y += (targetY - shape.position.y) * 0.1;
                
                shape.scale.x += (targetScale - shape.scale.x) * 0.1;
                shape.scale.y += (targetScale - shape.scale.y) * 0.1;
                shape.scale.z += (targetScale - shape.scale.z) * 0.1;
            }
        }

        // =========================================================
        // 🛑 BOILERPLATE AREA 
        // =========================================================
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 1, 0); 

        setup(scene);

        function engineLoop() {
            requestAnimationFrame(engineLoop);
            controls.update(); 
            animate();
            renderer.render(scene, camera);
        }
        
        engineLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
