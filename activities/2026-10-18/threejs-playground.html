<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Student Playground</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
    </style>
</head>
<body>
    
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA 
        // Focus only on these two functions!
        // =========================================================

        // Declare your variables up here so both functions can see them!

        const geometry = new THREE.ConeGeometry( 5, 10, 3, 2);
        const material = new THREE.MeshBasicMaterial(  {color: 0x66ff33, wireframe: true} );
        const cone = new THREE.Mesh(geometry, material );
        cone.position.set(-5, 0, 0);
        cone.rotation.set(0, 0, -1.5708);
        cone.scale.set(1/10, 1/5, 1/10)
        
        const geometry_sphere = new THREE.SphereGeometry( 7.5, 16, 8 );
        const material_sphere = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe: true} );
        const sphere = new THREE.Mesh( geometry_sphere, material_sphere );
        sphere.position.set(cone.position.x+1, cone.position.y, cone.position.z);
        sphere.scale.set(1/25, 1/25, 1/25)

        const geometry_torusKnot = new THREE.TorusKnotGeometry( 10, 3, 100, 16 );
        const material_torusKnot = new THREE.MeshBasicMaterial( { color: 0xff3300,  wireframe: true } );
        const torusKnot = new THREE.Mesh( geometry_torusKnot, material_torusKnot );
        torusKnot.scale.set(1/25, 1/25, 1/25);
        torusKnot.position.set(8, 0, 0);

        let enemies = [];
        let bullets = [];
        for (let s = 0; s < 100; s++) {
            const set_y = Math.floor(Math.random() * 30) + 1;
            const set_x = Math.floor(Math.random() * 100) + 1;
            const geometry_torusKnot = new THREE.TorusKnotGeometry ( 10, 3, 100, 16);
            const material_torusKnot = new THREE.MeshBasicMaterial({color: 0xff3300, wireframe: true});
            const torusKnot = new THREE.Mesh(geometry_torusKnot, material_torusKnot);
            torusKnot.scale.set(1/25, 1/25, 1/25);
            torusKnot.position.set(set_x, set_y-15, 0);
            {enemies.push(torusKnot);}
        }

        for (let s = 0; s < 20; s++) {
            const geometry_sphere = new THREE.TorusKnotGeometry ( 10, 3, 100, 16);
            const material_sphere = new THREE.MeshBasicMaterial({color: 0xff3300, wireframe: true});
            const sphere = new THREE.Mesh(geometry_sphere, material_sphere);
            {bullets.push(sphere);}
        }

        let pressing_down = false;
        let pressing_up = false;

        // 1. SETUP: This runs exactly once at the start.
        function setup(scene) {
            scene.add( cone );  
            // Create your geometry, materials, and meshes here.
            // Don't forget to use scene.add() to put them on the stage!
            window.addEventListener('keydown', (event) => {
                if (event.key === 'ArrowDown') pressing_down = true;
                if (event.key === 'ArrowUp') pressing_up = true;
            });
            window.addEventListener('keyup', (event) => {
                if (event.key === 'ArrowDown') pressing_down = false;
                if (event.key === 'ArrowUp') pressing_up = false;
                if (event.key === ' '){
                    const geometry_sphere = new THREE.SphereGeometry( 7.5, 16, 8 );
                    const material_sphere = new THREE.MeshBasicMaterial( { color: 0xffff00, wireframe: true} );
                    const sphere = new THREE.Mesh( geometry_sphere, material_sphere );
                    sphere.position.set(cone.position.x+1, cone.position.y, cone.position.z);
                    sphere.scale.set(1/25, 1/25, 1/25)
                    {bullets.push(sphere);}
                    scene.add( sphere );
                }
            });

            scene.add( sphere );
            scene.add( torusKnot );
            for (let y = 0; y<100 ; y++) {scene.add( enemies[y] )};
        }

        // 2. ANIMATE: This runs every single frame.
        function animate() {
            cone.rotation.x = cone.rotation.x + 0.01;
            // Add your rotation, movement, and logic here.
            if (pressing_down){
                cone.position.y = cone.position.y - 0.25;
            }  
            if (pressing_up){
                cone.position.y = cone.position.y + 0.25;
            }  
            sphere.position.x = sphere.position.x + 0.1;

            sphere.rotation.x = sphere.rotation.x + 0.05;
            sphere.rotation.y = sphere.rotation.y + 0.05;
            sphere.rotation.z = sphere.rotation.z + 0.05;

            if (sphere.position.x>7){
                sphere.position.x = cone.position.x+1;
                sphere.position.y = cone.position.y;
                sphere.position.z = cone.position.z;
            }

            for (let y = 0; y<bullets.length ; y++) {
                bullets[y].position.x = bullets[y].position.x + 0.1;
            };

            for (let y = 0; y<100 ; y++) {
                enemies[y].rotation.x = enemies[y].rotation.x + 0.019;
                enemies[y].rotation.y = enemies[y].rotation.y + 0.019;
                enemies[y].rotation.z = enemies[y].rotation.z + 0.019;

                enemies[y].position.x = enemies[y].position.x - 0.05;
            }
            for (let z = 0; z<bullets.length ; z++) {
                if (Math.sqrt((enemies[y].position.x-bullets[z].position.x)**2 + (enemies[y].position.y-bullets[z].position.y)**2+(enemies[y].position.z-bullets[z].position.z)**2)<1){
                    enemies[y].scale.x = enemies[y].scale.x * 0.99 * 0.7;
                    enemies[y].scale.y = enemies[y].scale.y * 0.99 * 0.7;
                   enemies[y].scale.z = enemies[y].scale.z * 0.99 * 0.7;
                }
            };
            torusKnot.rotation.x = torusKnot.rotation.x + 0.019;
            torusKnot.rotation.y = torusKnot.rotation.y + 0.019;
            torusKnot.rotation.z = torusKnot.rotation.z + 0.019;

            torusKnot.position.x = torusKnot.position.x - 0.05;

            if (Math.sqrt((torusKnot.position.x-sphere.position.x)**2 + (torusKnot.position.y-sphere.position.y)**2+(torusKnot.position.z-sphere.position.z)**2)<1){
                torusKnot.scale.x = torusKnot.scale.x * 0.99 * 0.7;
                torusKnot.scale.y = torusKnot.scale.y * 0.99 * 0.7;
                torusKnot.scale.z = torusKnot.scale.z * 0.99 * 0.7;
            }
            for (let y = 0; y<bullets.length ; y++) {
                if (Math.sqrt((torusKnot.position.x-bullets[y].position.x)**2 + (torusKnot.position.y-bullets[y].position.y)**2+(torusKnot.position.z-bullets[y].position.z)**2)<1){
                torusKnot.scale.x = torusKnot.scale.x * 0.99 * 0.7;
                torusKnot.scale.y = torusKnot.scale.y * 0.99 * 0.7;
                torusKnot.scale.z = torusKnot.scale.z * 0.99 * 0.7;
            }
            };
        }


        // =========================================================
        // 🛑 BOILERPLATE AREA 
        // Engine setup and complex math are hidden down here. 
        // You do not need to change anything below this line!
        // =========================================================
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Adds mouse controls so you can click and drag to look around
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 

        // Run the student's setup function and hand it the scene
        setup(scene);

        // The main engine loop
        function engineLoop() {
            requestAnimationFrame(engineLoop);
            
            controls.update(); // Keeps the mouse controls smooth
            
            // Run the student's animation instructions
            animate();
            
            // Draw everything to the screen
            renderer.render(scene, camera);
        }
        
        // Start the engine
        engineLoop();

        // Keep everything proportional if the window is resized
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
