<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Student Playground - 3D Tunnel Dodger</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <h1 id="Score">
        Score: 0
    </h1>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA 
        // Focus only on these two functions!
        // =========================================================

        var scoreboard = document.getElementById('Score');
        scoreboard.style.color = 'white';
        scoreboard.style.fontFamily = 'sans-serif';
        scoreboard.style.position = 'absolute';
        scoreboard.style.left = '20px';

        let score = 0;

        // Player ship (Green Cone pointing into the screen)
        const shipGeo = new THREE.ConeGeometry(1, 3, 4);
        const shipMat = new THREE.MeshBasicMaterial({ color: 0x66ff33, wireframe: true });
        const ship = new THREE.Mesh(shipGeo, shipMat);
        ship.position.set(0, 0, 15);
        ship.rotation.x = -Math.PI / 2; // Point tip toward -Z

        // Obstacles (30 recycled red cubes)
        let obstacles = [];
        const boxGeo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
        const boxMat = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: true });

        for (let i = 0; i < 30; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.x = (Math.random() - 0.5) * 30; // Random X (-15 to 15)
            box.position.y = (Math.random() - 0.5) * 20; // Random Y (-10 to 10)
            box.position.z = -Math.random() * 150;       // Spread out deep in the tunnel
            obstacles.push(box);
        }

        // Keyboard tracking
        let moveLeft = false;
        let moveRight = false;
        let moveUp = false;
        let moveDown = false;

        // 1. SETUP: This runs exactly once at the start.
        function setup(scene) {
            scene.add(ship);

            for (let i = 0; i < obstacles.length; i++) {
                scene.add(obstacles[i]);
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') moveLeft = true;
                if (e.key === 'ArrowRight') moveRight = true;
                if (e.key === 'ArrowUp') moveUp = true;
                if (e.key === 'ArrowDown') moveDown = true;
            });

            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') moveLeft = false;
                if (e.key === 'ArrowRight') moveRight = false;
                if (e.key === 'ArrowUp') moveUp = false;
                if (e.key === 'ArrowDown') moveDown = false;
            });
        }

        // 2. ANIMATE: This runs every single frame.
        function animate() {
            // Spin the ship slightly for visual flair
            ship.rotation.y += 0.03;

            // Move the ship inside a 20x12 invisible tunnel boundary
            if (moveLeft && ship.position.x > -10) ship.position.x -= 0.25;
            if (moveRight && ship.position.x < 10) ship.position.x += 0.25;
            if (moveUp && ship.position.y < 6) ship.position.y += 0.25;
            if (moveDown && ship.position.y > -6) ship.position.y -= 0.25;

            // Update obstacles
            for (let i = 0; i < obstacles.length; i++) {
                let box = obstacles[i];

                // Move toward the camera and spin
                box.position.z += 0.6;
                box.rotation.x += 0.02;
                box.rotation.y += 0.02;

                // Respawn obstacle far away once it flies past the player
                if (box.position.z > 25) {
                    box.position.z = -150;
                    box.position.x = (Math.random() - 0.5) * 24;
                    box.position.y = (Math.random() - 0.5) * 14;
                    score += 1;
                    scoreboard.innerHTML = 'Score: ' + score;
                }

                // Collision check using Three.js built-in distanceTo
                if (ship.position.distanceTo(box.position) < 1.8) {
                    score = 0;
                    scoreboard.innerHTML = 'Score: 0 (CRASH!)';
                    box.position.z = -150; // Reset the box you hit
                }
            }
        }


        // =========================================================
        // 🛑 BOILERPLATE AREA 
        // Engine setup and complex math are hidden down here. 
        // You do not need to change anything below this line!
        // =========================================================

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Adds mouse controls so you can click and drag to look around
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Run the student's setup function and hand it the scene
        setup(scene);

        // The main engine loop
        function engineLoop() {
            requestAnimationFrame(engineLoop);

            controls.update(); // Keeps the mouse controls smooth

            // Run the student's animation instructions
            animate();

            // Draw everything to the screen
            renderer.render(scene, camera);
        }

        // Start the engine
        engineLoop();

        // Keep everything proportional if the window is resized
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
