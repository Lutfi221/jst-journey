<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clapperboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="flash-overlay"></div>

    <div class="slate-container">
        <div class="clapper-stick top-stick" id="top-stick"></div>
        <div class="clapper-stick bottom-stick"></div>

        <div class="info-grid">
            <div class="input-group full-width">
                <label for="production">PROD.</label>
                <input type="text" id="production" value="My Awesome Indie Film">
            </div>

            <div class="input-group">
                <label for="roll">ROLL</label>
                <input type="text" id="roll" value="A001">
            </div>

            <div class="input-group">
                <label for="scene">SCENE</label>
                <input type="text" id="scene" value="1A">
            </div>

            <div class="input-group">
                <label for="take">TAKE</label>
                <input type="number" id="take" value="1">
            </div>
        </div>

        <button id="clap-btn">CLAP!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
