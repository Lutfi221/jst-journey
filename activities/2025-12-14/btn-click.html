<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Btn Click</title>
</head>
<body>
    <button onclick="bonk(this)">Click me</button>

    <button onclick="bonk2()" id="click2">Click me 2</button>

    <script>
        function bonk(elem) {
            elem.innerText = "You clicked me!";
        }

        function bonk2() {
            var elem = document.getElementById("click2");
            elem.innerText = "You just clicked me!";
        }
    </script>
</body>
</html>
