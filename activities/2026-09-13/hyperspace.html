<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js Hyperspace Jump - Bigger & denser</title>
    <style>body { margin: 0; overflow: hidden; background-color: #000000; } canvas { display: block; }</style>
</head>
<body>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA
        // =========================================================
        
        let stars = []; 
        // 1. Changed from 600 to 1200
        const STAR_COUNT = 1200; 
        
        let currentSpeed = 0; 
        const TARGET_SPEED = 2.5; 
        let startTime; 

        function setup(scene) {
            // 2. Changed from 0.05 to 0.1 for X, Y, and Z
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
            
            for (let i = 0; i < STAR_COUNT; i++) {
                const star = new THREE.Mesh(geometry, material);
                
                star.position.x = (Math.random() - 0.5) * 200;
                star.position.y = (Math.random() - 0.5) * 200;
                star.position.z = (Math.random() - 0.5) * 200 - 100; 
                
                scene.add(star);
                stars.push(star);
            }

            startTime = Date.now();
        }

        function animate() {
            if (Date.now() - startTime > 1000) {
                currentSpeed += (TARGET_SPEED - currentSpeed) * 0.003;
            } else {
                currentSpeed = 0.005;
            }

            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                
                star.position.z += currentSpeed;
                
                star.scale.z = 1 + (currentSpeed * 40); 
                
                if (star.position.z > 15) {
                    star.position.z = -200; 
                    star.position.x = (Math.random() - 0.5) * 200;
                    star.position.y = (Math.random() - 0.5) * 200;
                }
            }
        }

        // =========================================================
        // 🛑 BOILERPLATE AREA (Do not change)
        // =========================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x000000, 10, 150); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        setup(scene); 

        function engineLoop() { 
            requestAnimationFrame(engineLoop); 
            controls.update(); 
            animate(); 
            renderer.render(scene, camera); 
        }

        engineLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
