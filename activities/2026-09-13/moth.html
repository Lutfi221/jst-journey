<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js Moth Swarm</title>
    <style>body { margin: 0; overflow: hidden; background-color: #0d0d1a; } canvas { display: block; }</style>
</head>
<body>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA 
        // =========================================================

        let lantern;
        let moths = []; 

        function setup(scene) {
            const lanternGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            lantern = new THREE.Mesh(lanternGeo, lanternMat);
            scene.add(lantern);

            const mothGeo = new THREE.ConeGeometry(0.03, 0.1, 4); 
            const mothMat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa }); 
            
            for (let i = 0; i < 150; i++) {
                const moth = new THREE.Mesh(mothGeo, mothMat);
                
                moth.position.x = (Math.random() - 0.5) * 15;
                moth.position.y = (Math.random() - 0.5) * 15;
                moth.position.z = (Math.random() - 0.5) * 15;
                
                scene.add(moth);
                moths.push(moth); 
            }
        }

        function animate() {
            const time = Date.now() * 0.001;
            lantern.position.x = Math.sin(time) * 4;
            lantern.position.y = Math.cos(time * 0.7) * 3;
            lantern.position.z = Math.sin(time * 1.3) * 4;

            for (let i = 0; i < moths.length; i++) {
                let moth = moths[i];
                
                moth.position.lerp(lantern.position, 0.02);
                moth.lookAt(lantern.position); 

                // The fluttering chaos
                moth.position.x += (Math.random() - 0.5) * 0.3;
                moth.position.y += (Math.random() - 0.5) * 0.3;
                moth.position.z += (Math.random() - 0.5) * 0.3;
            }
        }

        // =========================================================
        // 🛑 BOILERPLATE AREA 
        // =========================================================
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        setup(scene);

        function engineLoop() {
            requestAnimationFrame(engineLoop);
            controls.update(); 
            animate();
            renderer.render(scene, camera);
        }
        
        engineLoop();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
