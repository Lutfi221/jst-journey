<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Student Playground</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        canvas { display: block; }
    </style>
</head>
<body>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // =========================================================
        // 🧑‍🎓 STUDENT AREA 
        // Focus only on these two functions!
        // =========================================================

        // We declare the cube variable here so both functions can see it
        let cube; 

        // 1. SETUP: This runs exactly once at the start.
        function setup(scene) {
            // Define the shape and color
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
            
            // Combine them into a 3D object
            cube = new THREE.Mesh(geometry, material);
            
            // Add the cube to our world
            scene.add(cube);
        }

        // 2. ANIMATE: This runs every single frame (about 60 times a second).
        function animate() {
            // Change the rotation a tiny bit every frame
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
        }


        // =========================================================
        // 🛑 BOILERPLATE AREA 
        // Engine setup and complex math are hidden down here. 
        // You do not need to change anything below this line!
        // =========================================================
        
        // Setup the Scene, Camera, and WebGL Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Run the student's setup function and hand it the scene
        setup(scene);

        // The main engine loop
        function engineLoop() {
            requestAnimationFrame(engineLoop);
            
            // Run the student's animation instructions
            animate();
            
            // Draw everything to the screen
            renderer.render(scene, camera);
        }
        
        // Start the engine
        engineLoop();

        // Keep everything proportional if the window is resized
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
