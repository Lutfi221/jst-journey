<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js Director</title>
    <style>body { margin: 0; overflow: hidden; background-color: #1a1a1a; } canvas { display: block; }</style>
</head>
<body>
    <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
    <script type="module">
        import * as THREE from 'three';

        // 🧑‍🎓 STUDENT AREA
        let myRing; 

        function setup(scene) {
            // 1. Create the shape (a donut)
            const geometry = new THREE.TorusGeometry(1, 0.02, 16, 100);
            // 2. Create the look (yellow glowing wireframe)
            const material = new THREE.MeshBasicMaterial({ color: 0xffbb00, wireframe: true });
            
            // 3. Combine them into a Mesh
            myRing = new THREE.Mesh(geometry, material);
            
            // Tilt it backward slightly
            myRing.rotation.x = Math.PI / 2.5;
            
            // 4. Put it on the stage
            scene.add(myRing);
        }

        function animate() {
            // Rotate the ring on its Z-axis every single frame
            myRing.rotation.z += 0.01;
        }

        // 🛑 BOILERPLATE AREA (Do not change)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 2;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        setup(scene);
        function engineLoop() { requestAnimationFrame(engineLoop); animate(); renderer.render(scene, camera); }
        engineLoop();
    </script>
</body>
</html>
