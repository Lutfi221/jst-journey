<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js Director</title>
    <style>body { margin: 0; overflow: hidden; background-color: #1a1a1a; } canvas { display: block; }</style>
</head>
<body>
    <script type="importmap">
        { 
            "imports": { 
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            } 
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 🧑‍🎓 STUDENT AREA
        let rings = []; // This empty list will hold all our rings

        function setup(scene) {
            const geometry = new THREE.TorusGeometry(1, 0.02, 16, 100);
            const material = new THREE.MeshBasicMaterial({ color: 0xffbb00, wireframe: true });
            
            // Loop 15 times
            for (let i = 0; i < 15; i++) {
                const ring = new THREE.Mesh(geometry, material);
                
                // Scale math: The 1st ring (i=0) is scale 1. The 10th ring (i=9) is scale 4.6.
                const scaleAmount = 1 + (i * 0.4);
                ring.scale.set(scaleAmount, scaleAmount, scaleAmount);
                
                ring.rotation.x = Math.PI / 2.5;
                
                scene.add(ring);
                rings.push(ring); // Save this specific ring into our list!
            }
        }

        function animate() {
            // Loop through our list of 15 rings every frame
            for (let i = 0; i < rings.length; i++) {
                
                // The math trick: multiply speed by (i + 1)
                // Ring 0 spins at 0.002 speed. Ring 10 spins at 0.022 speed!
                rings[i].rotation.z += 0.002 * (i + 1);
                
                // Bonus: Add a tiny wobble to make it feel organic
                rings[i].rotation.x += Math.sin(Date.now() * 0.001 + i) * 0.001;
            }
        }

        // 🛑 BOILERPLATE AREA (Do not change)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Gives it a smooth, cinematic glide

        setup(scene); // <-- Find this line in your code

        function engineLoop() { 
            requestAnimationFrame(engineLoop); 
            controls.update(); // Add this line so the smooth glide works
            animate(); 
            renderer.render(scene, camera); 
        }

        engineLoop();
    </script>
</body>
</html>
